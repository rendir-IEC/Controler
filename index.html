function radar(dims,sz=140,col='#4C9DC6'){
  const cx=sz/2,cy=sz/2,r=sz*0.31,n=dims.length,ang=i=>(2*Math.PI*i)/n-Math.PI/2;
  const pt=(sc,i)=>({x:cx+(sc/100)*r*Math.cos(ang(i)),y:cy+(sc/100)*r*Math.sin(ang(i))});
  const path=pts=>pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join('')+'Z';
  const dp=dims.map((d,i)=>pt(d.s,i));
  let g='',ax='',lb='';
  [25,50,75,100].forEach(l=>{g+=`<path d="${path(dims.map((_,i)=>pt(l,i)))}" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;});
  dims.forEach((_,i)=>{const p=pt(100,i);ax+=`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;});
  dims.forEach((d,i)=>{const lp={x:cx+(r+22)*Math.cos(ang(i)),y:cy+(r+22)*Math.sin(ang(i))};lb+=`<text x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="rgba(255,255,255,0.35)" font-size="9" font-weight="600" font-family="Sora,sans-serif">${d.id}</text>`;});
  return `<svg width="${sz}" height="${sz}" style="overflow:visible"><g>${g}${ax}<path d="${path(dp)}" fill="${col}18" stroke="${col}" stroke-width="1.6"/>${dp.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${col}"/>`).join('')}${lb}</g></svg>`;
}

function startEx(n){kT();S.pEx=n;S.hrvSec=20;S.bp='INHALA';S.sc='hrv';R();sHrv();}

let e1r=false;
function sEx1T(){if(e1r)return;e1r=true;tT(setInterval(()=>{if(S.sc!=='ex1'||S.e1done){e1r=false;return;}S.e1s--;const el=document.getElementById('e1t'),b=document.getElementById('e1b');const rc=RC[S.user?.role]||'#4C9DC6';const tc=S.e1s<=15?'var(--red)':rc;if(el){el.textContent=S.e1s;el.style.color=tc;}if(b){b.style.width=`${(S.e1s/60)*100}%`;b.style.background=tc;}if(S.e1s<=0){e1r=false;fEx1();}},1000));const ds=S.ex?.dist||DIST.DEFAULT;const show=()=>{if(S.e1done||S.sc!=='ex1')return;S.e1d=ds[Math.floor(Math.random()*ds.length)];R();sEx1T();tT(setTimeout(()=>{if(S.e1d){S.e1d=null;if(S.sc==='ex1'){R();sEx1T();}}},4500));};tT(setTimeout(show,10000));tT(setTimeout(show,28000));tT(setTimeout(show,46000));}

        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--blue);margin-bottom:14px">WEB3FORMS · EMAIL DE INFORMES</div>
        <div style="font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:16px">
          Regístrate en <strong style="color:var(--t1)">web3forms.com</strong> con tu email de RENDIR<br>
          y copia tu Access Key aquí
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--t3);letter-spacing:1px;margin-bottom:7px">ACCESS KEY</div>
          <input id="cfg-wf-key" style="width:100%;padding:13px 16px;background:var(--s1);border:1.5px solid var(--b1);border-radius:8px;color:var(--t1);font-size:14px;font-family:monospace" type="text" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" value="${cfg.wfKey||''}">
        </div>
      </div>

      <!-- ESTADO -->
      <div style="background:var(--s2);border:1px solid var(--b1);border-radius:14px;padding:20px;margin-bottom:20px">
        <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--blue);margin-bottom:14px">ESTADO ACTUAL</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;color:var(--t2)">Stripe Individual</span>
            <span style="font-size:12px;font-weight:700;color:${cfg.stripeInd&&cfg.stripeInd.includes('stripe')?'var(--green)':'var(--red)'}">${cfg.stripeInd&&cfg.stripeInd.includes('stripe')?'ACTIVO':'SIN CONFIGURAR'}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;color:var(--t2)">Stripe Pro</span>
            <span style="font-size:12px;font-weight:700;color:${cfg.stripePro&&cfg.stripePro.includes('stripe')?'var(--green)':'var(--red)'}">${cfg.stripePro&&cfg.stripePro.includes('stripe')?'ACTIVO':'SIN CONFIGURAR'}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;color:var(--t2)">Email de informes</span>
            <span style="font-size:12px;font-weight:700;color:${cfg.wfKey&&cfg.wfKey.length>10?'var(--green)':'var(--red)'}">${cfg.wfKey&&cfg.wfKey.length>10?'ACTIVO':'SIN CONFIGURAR'}</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <span style="font-size:13px;color:var(--t2)">Usuarios registrados</span>
            <span style="font-size:12px;font-weight:700;color:var(--blue)">${JSON.parse(localStorage.getItem('ctrl_us')||'[]').length}</span>
          </div>
        </div>
      </div>

      <button onclick="saveConfig()" style="width:100%;height:52px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:700;background:var(--blue);color:#fff;font-family:var(--fb);margin-bottom:10px">
        Guardar configuración
      </button>
      <button onclick="document.getElementById('cfg-panel').remove()" style="width:100%;height:44px;border-radius:10px;border:1.5px solid var(--b1);cursor:pointer;font-size:14px;background:transparent;color:var(--t2);font-family:var(--fb)">
        Cancelar
      </button>

      <div style="margin-top:20px;padding:14px;background:rgba(200,148,10,.08);border:1px solid rgba(200,148,10,.2);border-radius:10px">
        <div style="font-size:11px;font-weight:700;color:var(--gold-l);margin-bottom:5px">ACCESO A ESTE PANEL</div>
        <div style="font-size:12px;color:var(--t3);line-height:1.6">Pulsa 5 veces seguidas sobre el logotipo C de la pantalla de inicio, o añade ?setup a la URL del navegador.</div>
      </div>
    </div>`;
  document.body.appendChild(panel);

  // Also check URL param
}

function saveConfig() {
  const ind = document.getElementById('cfg-stripe-ind')?.value.trim();
  const pro = document.getElementById('cfg-stripe-pro')?.value.trim();
  const wf  = document.getElementById('cfg-wf-key')?.value.trim();
  const cfg = {};
  if (ind) cfg.stripeInd = ind;
  if (pro) cfg.stripePro = pro;
  if (wf)  cfg.wfKey = wf;
  localStorage.setItem('ctrl_cfg', JSON.stringify(cfg));
  if (ind) STRIPE_LINKS.ind = ind;
  if (pro) STRIPE_LINKS.pro = pro;
  if (wf)  window._WF_KEY = wf;
  document.getElementById('cfg-panel').remove();
  // Show success
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:calc(var(--nh) + 16px);left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 24px;border-radius:99px;font-size:14px;font-weight:700;z-index:1000;white-space:nowrap;animation:fu .3s ease both';
  toast.textContent = 'Configuración guardada';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// Check URL param on load
if (window.location.search.includes('setup')) {
  window.addEventListener('DOMContentLoaded', () => setTimeout(showConfigPanel, 500));
}

// INIT
(function(){loadConfig();const u=A.user();if(u){S.user=u;S.ex=getEx(u.role,u.sector);S.sc='home';S.tab='home';}else S.sc='landing';R();})();
</script>
</body>
</html>
